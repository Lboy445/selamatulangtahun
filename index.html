<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-image: url('image/background.jpg');
            background-color: #f4f4f4;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: 0.5s;
        }

        .mulai {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: -20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 60px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .btn-mulai {
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-mulai:hover {
            background-color: #0056b3;
        }

        .content {
            display: flex;
            width: 100vw;
            height: 40vh;
            justify-content: center;
            align-items: center;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 60px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            animation: JedagJedug .2s ease-in-out;
        }

        .gambar {
            text-align: center;
            width: 130px;
            animation: JedagJedug .2s ease-in-out;
        }

        .player {
            width: 950px;
            max-width: 95%;
        }

        canvas {
            width: 100%;
            height: 300px;
            background: transparent;
        }

        .progress {
            width: 100%;
            height: 8px;
            margin-top: 15px;
            position: relative;
            cursor: pointer;
            border-radius: 20px;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(10px);
        }

        .fill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: rgba(255, 255, 255, .75);
        }

        .bullet {
            width: 18px;
            height: 18px;
            position: absolute;
            left: 0%;
            top: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, .95);
            box-shadow: 0 0 20px rgba(255, 255, 255, .6);
        }

        .teks {
            font-size: small;
            font-weight: bold;
            color: #000000;
            font-family: Verdana;
            margin: 10px;
        }

        .mark {
            font-size: small;
            font-weight: bold;
            color: #000000;
            opacity: 20%;
            font-family: Verdana;
            position: absolute;
            margin-top: 80vh;
        }

        img {
            width: 130px;
        }

        .hope {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: masuk .2s ease-in;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .tombol_pesawat {
            width: 10px;
        }

        .tombol {
            display: flex;
            background-color: #526bea;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #000;
            font-size: medium;
            margin-top: 10px;
            cursor: pointer;
        }

        .baris {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .amplop {
            width: 60px;
            animation: JedagJedug .5s ease-in;
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 6px solid #444;
            border-top: 6px solid #00c5e7;
            border-radius: 50%;
            animation: spin 1.3s linear infinite;
        }

        .terakhir {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            animation: masuk .2s ease-in;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            position: absolute;
            max-width: 90%;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes JedagJedug {
            0% {
                transform: scale(0.5);
            }

            100% {
                transform: scale(1);
            }
        }

        @media screen and (min-width: 768px) {
            .box {
                padding: 20px 60px;
            }

            .terakhir{
                max-width: 60%;
            }
        }

        @media screen and (min-width: 1024px) {
            .box {
                padding: 20px 60px;
            }

            .terakhir{
                max-width: 60%;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="container">
        <img src="image/hello.gif" alt="" style="border-radius: 50%; border: 2px solid #403d3d;">
        <p class="teks">Hay Lanaa! klick Mulai</p>
        <button class="btn-mulai" id="btnMulai">Mulai</button>
    </div>

    <div class="mulai" id="mulai">
        <div class="player" id="player">
            <canvas id="canvas" width="1000" height="300" style="margin-top: -2000px; margin-bottom: 20px;"></canvas>
        </div>
        <div class="content" id="content">
            <div class="box" id="box">
                <img src="image/hbd.gif" alt="" id="gambar" class="gambar">
                <p class="teks" id="teks">Selamat Ulang Tahun</p>
                <button class="btn-mulai" onclick="next()">Next</button>
            </div>
            <div class="box" id="box2">
                <img src="image/19.gif" alt="" class="gambar">
                <p class="teks">Cie Sudah 19 Tahun</p>
                <button class="btn-mulai" onclick="next()">Next</button>
            </div>
            <div class="box" id="box3">
                <img src="image/Semoga.gif" alt="" id="gambar2" class="gambar">
                <p class="teks" id="teks2">Semoga Panjang Umur</p>
                <button class="btn-mulai" onclick="next()">Next</button>
            </div>
            <div class="baris" id="harapan">
                <div class="hope" id="hope">
                    <h3>Harapan</h3>
                    <input type="text" placeholder="Ketik disini" id="isiTeks">
                    <a class="tombol" onclick="kirim()"><img src="image/send.png" alt="" class="tombol_pesawat"></a>
                </div>
                <div class="hope" id="loading">
                    <main role="main" aria-live="polite" aria-busy="true">
                        <div>
                            <div class="spinner" aria-hidden="true"></div>
                        </div>
                    </main>
                </div>
            </div>
            <div class="terakhir" id="terakhir">
                <p class="teks" id="kata"></p>
                <img src="image/sanrio.gif" class="gambar" style="width: 100px;" alt="">
            </div>
        </div>
        <a onclick="pesan()" id="surat"><img src="gambar/email.png" class="amplop" alt=""></a>
        <div class="player" id="player2">
            <div class="progress" id="progress">
                <div class="fill" id="fill"></div>
                <div class="bullet" id="bullet"></div>
            </div>
            <audio id="audio" crossorigin="anonymous" autoplay>
                <source src="image/melody.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>
    <p class="mark">@latellost3 | Golem</p>

    <script>
        const container = document.getElementById('container');
        const btnMulai = document.getElementById('btnMulai');
        const mulai = document.getElementById('mulai');
        const audio = document.getElementById("audio");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fill = document.getElementById("fill");
        const box = document.getElementById("box");
        const box2 = document.getElementById("box2");
        const box3 = document.getElementById("box3");
        const bullet = document.getElementById("bullet");
        const progress = document.getElementById("progress");
        const hope = document.getElementById("hope");
        const loading = document.getElementById("loading");
        const harapan = document.getElementById("harapan");
        const isiTeks = document.getElementById("isiTeks");
        const surat = document.getElementById("surat");
        const terakhir = document.getElementById("terakhir");
        const kata = document.getElementById("kata");

        mulai.style.display = 'none';
        box2.style.display = 'none';
        box3.style.display = 'none';
        loading.style.display = "none";
        harapan.style.display = "none";
        surat.style.display = "none";
        terakhir.style.display = "none";

        btnMulai.addEventListener('click', function () {
            container.style.display = 'none';
            mulai.style.display = 'flex';
            playAudio();
        });
        let n = 0;
        function next() {
            n += 1;
            if (n == 1) {
                box2.style.display = 'flex';
                box.style.display = 'none';
            }
            console.log(n)
            if (n == 2) {
                box3.style.display = "flex";
                box2.style.display = 'none';
            }
            if (n == 3) {
                harapan.style.display = "flex";
                box3.style.display = 'none';
            }
        }

        let audioContext;
        let analyser;
        let dataArray;
        let bufferLength;
        let isInitialized = false;

        function initAudioContext() {
            if (isInitialized) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            analyser.fftSize = 32;

            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            isInitialized = true;
        }

        audio.addEventListener("timeupdate", () => {
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            fill.style.width = percent + "%";
            bullet.style.left = percent + "%";
        });

        audio.addEventListener("ended", () => {
            audio.currentTime = 0;
            audio.play();
        });

        progress.addEventListener("click", (e) => {
            const rect = progress.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        function animate() {
            if (!isInitialized) return;

            requestAnimationFrame(animate);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const midX = canvas.width / 2;
            const baseBarWidth = (canvas.width / 2) / bufferLength;

            const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
            gradient.addColorStop(0, "rgba(255, 255, 255, 0.4)");
            gradient.addColorStop(0.3, "rgba(255, 255, 255, 0.9)");
            gradient.addColorStop(1, "rgba(255, 255, 255, 1.0)");
            ctx.fillStyle = gradient;

            const gap = 18;
            let finalBarWidth = baseBarWidth - gap;
            if (finalBarWidth <= 2) finalBarWidth = 2;

            const borderRadius = finalBarWidth / 2;

            for (let i = 0; i < bufferLength; i++) {
                const heightMultiplier = 0.45;
                const value = ((dataArray[i] / 255) * canvas.height * heightMultiplier) + 4;

                const distanceFromCenter = i * baseBarWidth;
                const rightX = midX + distanceFromCenter + (gap / 2);
                const leftX = midX - distanceFromCenter - baseBarWidth + (gap / 2);
                const y = canvas.height - value;

                ctx.beginPath();
                ctx.roundRect(rightX, y, finalBarWidth, value, [borderRadius, borderRadius, 0, 0]);
                ctx.fill();

                ctx.beginPath();
                ctx.roundRect(leftX, y, finalBarWidth, value, [borderRadius, borderRadius, 0, 0]);
                ctx.fill();
            }
        }

        function playAudio() {
            audio.play();
            animate();
        }

        audio.addEventListener("play", () => {
            initAudioContext();
            audioContext.resume();
            animate();
        });

        function terkirim() {
            loading.style.display = "flex";
            let time = 0;
            let loaded = setInterval(() => {
                time += 1;
                if (time == 3) {
                    clearInterval(loaded);
                    surat.style.display = "flex";
                    const mainContainer = document.querySelector('#loading main');
                    mainContainer.innerHTML = '<img src="image/apa.gif" alt="" style="width:100px; height:100px;"><p style="font-weight: bold; margin:10px;">Tadi apa isi permohonanmu?.</p>';
                }
            }, 1000);
        }

        function kirim() {
            let kata = isiTeks.value;
            if (kata.length > 0) {
                hope.style.display = "none";
                terkirim();
            }
        }

        function pesan() {
            let kata2 = isiTeks.value;
            console.log(kata2);
            surat.style.display = "none";
            harapan.style.display = "none";
            terakhir.style.display = "flex";
            kata.textContent = "selamat ulang tahun ya, ciee udah makin tua. Semoga di usia 19 tahun ini kamu bahagia selalu, baterai energi selalu 100%, dan gak gampang overheat kalau diuji keadaan... Dan harapan yang kamu tulis tadi ''" + kata2 + "'', Semoga di tahun ini harapan mu itu bisa terkabul dan semngat terus kuliahnya.";
        }
    </script>

</body>

</html>
